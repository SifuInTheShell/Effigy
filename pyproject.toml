[project]
name = "effigy"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "sse-starlette>=2",
    "mcp>=2.3",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pillow>=12.3.0",
    "trimesh>=4.5",
    "scipy>=1.13",
    "networkx>=3",  # trimesh orients the convex hull with it
]

[dependency-groups]
dev = [
    "httpx2>=2",
    "pytest>=8",
    "ruff>=0.6",
]
# .venv-ml: UV_PROJECT_ENVIRONMENT=.venv-ml uv sync --frozen --group ml
# Our sm_120 CUDA wheels (wheels.yml builds and commits them; Windows only, the steps that need them
# don't run on Linux CI)
ml = [
    "cumesh==0.0.1; sys_platform == 'win32'",
    "flex-gemm==1.0.0; sys_platform == 'win32'",
    "o-voxel==0.0.1; sys_platform == 'win32'",
    "triton-windows>=3.4,<3.5; sys_platform == 'win32'",  # FlexGEMM's Triton half; 3.4 = torch 2.8's Triton
    "torch==2.8.0",
    "torchvision==0.23.0",
    "diffusers>=0.40",
    "accelerate>=1.0",
    "peft>=0.21",  # M50: diffusers loads the 2D style LoRAs through it
    "transformers>=5,<6",
    "timm>=1.0",
    "kornia>=0.8",
    "einops>=0.8",
    "easydict>=1.10",  # TRELLIS.2/Pixal3D samplers; LGPL-3.0, see licenses.yaml
    "onnxruntime>=1.20",  # CPU: DWPose for the A-pose gate (M16); never next to onnxruntime-gpu
]
# .venv-skin: UV_PROJECT_ENVIRONMENT=.venv-skin uv sync --frozen --group skin
# rig_skin's learned engine (M20): the MIT no-Blender port of SkinTokens, pinned to a commit. Its own
# venv because the vendored upstream core carries a GPL-provenance subtree (never imported by the server;
# the rig_skin step is the subprocess, see licenses.yaml)
skin = [
    "torch==2.8.0",
    "comfyui-skintokens-noblender",
]
# .venv-kimodo: UV_PROJECT_ENVIRONMENT=.venv-kimodo uv sync --frozen --group kimodo
# M26 text-to-motion: NVIDIA Kimodo (Apache-2.0 code, pinned commit). Its own venv: it pins
# transformers==5.1.0 while .venv-ml runs 5.18, so the two groups are declared conflicting below.
kimodo = [
    "torch==2.8.0",
    "kimodo",
]
# .venv-parts: UV_PROJECT_ENVIRONMENT=.venv-parts uv sync --frozen --group parts
# M31 parts: GeoSAM2 (Apache-2.0, VAST-AI) as our own pure-Python wheel in wheels/ (built with
# GEOSAM2_BUILD_CUDA=0 at upstream b5de23c: the CUDA extension is an optional post-processing speed-up);
# its own venv because it needs OpenCV 4 (5 cannot read its EXR depth maps) beside .venv-ml's OpenCV 5;
# the wheel's metadata drops upstream's opencv-python (a second cv2 beside headless) and ninja (no compile)
parts = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "geosam2==0.1.0",
    "opencv-python-headless>=4.11,<5",
]
# .venv-gemx: GIT_LFS_SKIP_SMUDGE=1 UV_PROJECT_ENVIRONMENT=.venv-gemx uv sync --frozen --group gemx
# M34 motion from video: NVIDIA GEM-X (Apache-2.0 code, vendored in engine/gemx with SAM 3D Body's package)
# on torch 2.10 (its own venv: the other groups pin 2.8), SOMA (py-soma-x, Apache-2.0) at the commit GEM-X
# pins (its assets come with the model group `mocap`, so skip its Git LFS files when syncing)
gemx = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "py-soma-x",
    "warp-lang==1.12.0",
    "timm==0.6.7",
    "lightning>=2.6,<2.7",
    "pytorch-lightning>=2.6,<2.7",
    "hydra-core==1.3.0",
    "hydra-colorlog>=1.2",
    "omegaconf>=2.3",
    "rich>=13",
    "einops>=0.8",
    "imageio==2.34.1",
    "av>=13,<14",
    "ffmpeg-python>=0.2",  # imported by GEM-X's video helpers; the ones we call read through PyAV
    "opencv-python-headless>=4.11",
    "tqdm>=4.66",
    "scipy>=1.13",
    "huggingface-hub>=0.34",
    "safetensors>=0.4",
    "transformers>=5,<6",
    "yacs>=0.1.8",
    "termcolor>=2",  # DINOv3's code (ViTPose's backbone class) logs with it
    "roma>=1.5",
    "braceexpand>=0.1.7",
    "onnxruntime-gpu>=1.20,<1.24",  # the YOLOX person detector (yolox_l.onnx); 1.24+ is built for CUDA 13, torch 2.10 cu128 brings 12.8
    "trimesh>=4.5",
]
# .venv-moge: UV_PROJECT_ENVIRONMENT=.venv-moge uv sync --frozen --group moge (Setup's Parallax layers card)
# M55 depth for parallax layers: Microsoft MoGe-3 (MIT, pinned commit) with its MIT helpers. Its own venv: it needs
# FlexGEMM at b2fadb2 (pure Triton, flex_gemm.nn) while .venv-ml keeps the CUDA wheel TRELLIS.2 runs on
moge = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "moge",
    "utils3d-moge",  # MoGe's helpers, named here so their pinned sources (below) apply
    "pipeline",
    "flex-gemm",  # the source for this group: FlexGEMM at b2fadb2 (below)
    "triton-windows>=3.4,<3.5; sys_platform == 'win32'",  # torch 2.8's Triton
]

[tool.uv]
package = false
default-groups = ["dev"]
conflicts = [
    [{ group = "ml" }, { group = "kimodo" }],
    [{ group = "skin" }, { group = "kimodo" }],
    [{ group = "ml" }, { group = "parts" }],
    [{ group = "skin" }, { group = "parts" }],
    [{ group = "kimodo" }, { group = "parts" }],
    [{ group = "ml" }, { group = "gemx" }],
    [{ group = "skin" }, { group = "gemx" }],
    [{ group = "kimodo" }, { group = "gemx" }],
    [{ group = "parts" }, { group = "gemx" }],
    [{ group = "ml" }, { group = "moge" }],
    [{ group = "gemx" }, { group = "moge" }],
]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# MoGe-3's own list without its demo app (gradio, starlette) and CLI (click): the depth step imports none of them
[[tool.uv.dependency-metadata]]
name = "moge"
version = "3.0.0"
requires-dist = [
    "numpy>=2",
    "opencv-python-headless",
    "scipy>=1.8",
    "pillow",
    "matplotlib",
    "trimesh>=4.11",
    "huggingface-hub",
    "requests",
    "tqdm",
    "torch>=2.4",
    "torchvision>=0.19",
    "utils3d-moge",
    "pipeline",
    "flex-gemm",
]

[tool.uv.sources]
geosam2 = { path = "wheels/geosam2-0.1.0-py3-none-any.whl" }
kimodo = { url = "https://github.com/nv-tlabs/kimodo/archive/1aece8c124d73d255ceff5086d983b844c9f4e94.zip" }
py-soma-x = { url = "https://github.com/NVlabs/SOMA-X/archive/e0f8ff0ecfa3edbbb6058b1e0f08822ee2f84ee5.zip" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
cumesh = { path = "wheels/cumesh-0.0.1-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" }
flex-gemm = [
    { path = "wheels/flex_gemm-1.0.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'", group = "ml" },
    { url = "https://github.com/JeffreyXiang/FlexGEMM/archive/b2fadb29d41846c7981ade6801ffc689fae119cf.zip", group = "moge" },
]
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "74fbce054ebed49800de42d0ad0e83495065719a" }
utils3d-moge = { url = "https://github.com/EasternJournalist/utils3d-moge/archive/62f09d58509485564e24d5d9f6aac9ee9ebc0c37.zip" }
pipeline = { url = "https://github.com/EasternJournalist/pipeline/archive/1c511390d90226c00c101f34b84df26a0f8789b4.zip" }
o-voxel = { path = "wheels/o_voxel-0.0.1-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" }
comfyui-skintokens-noblender = { url = "https://github.com/stevelittlefish/ComfyUI-SkinTokens-NoBlender/archive/0f7cb09af87001333aa1127eb1df4a4b154487e7.zip" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = [  # vendored, unmodified
    "docs",  # reviews' evidence scripts, kept as their authors wrote them
    "ui",
    "engine/trellis2/trellis2",
    "engine/pixal3d/pixal3d",
    "engine/pixal3d/naf",
    "engine/geosam2/inference.py",
    "engine/geosam2/single_view_point_prompt_infer.py",
    "engine/gemx/gem",
    "engine/gemx/configs",
    "engine/gemx/sam_3d_body",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-third-party = ["mcp"]  # the SDK, not our mcp/ folder

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
